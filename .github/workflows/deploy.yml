name: Deploy to Vercel

on:
  push:
    branches: [main]
  schedule:
    # UTC 16:05 = Taiwan time 00:05 daily — rebuild so newly "unlocked" (dated today or earlier) articles go live
    - cron: '5 16 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: curl -s -X POST 'https://api.vercel.com/v1/integrations/deploy/prj_xYJGfT002HJG7kg5rSODBqO0q7Fn/2QphDI5u3G' | jq .
